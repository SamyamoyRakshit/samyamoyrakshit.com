# Dependency updates.
#
# A static site has no server to attack, so the realistic supply-chain risk
# here is a compromised or vulnerable build-time package rather than anything
# reaching a visitor. Monthly is the right cadence for that: weekly on a
# personal site produces noise that gets ignored, which is worse than not
# having the alerts at all.
#
# Minor and patch updates are grouped into one pull request so a month's
# housekeeping is a single review, while majors arrive separately because they
# are the ones that need reading.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # satori draws the share cards, and its 0.x "minor" releases are not
      # minor. 0.29 -> 0.62 changed the layout model: the monogram and the
      # title overflowed the canvas and the footer disappeared completely.
      # Every check still went green, because `check:build` asserts that an
      # og:image exists, not that it is legible — so this is a break that only
      # looking at the picture catches.
      #
      # One package therefore fails the whole monthly group pull request, and
      # re-diagnosing it every month costs more than the upgrade is worth.
      # Patches inside 0.29.x still come through.
      #
      # Lift this as part of migrating `src/pages/og/[...slug].png.ts` to the
      # newer layout, and not before.
      - dependency-name: satori
        update-types:
          - version-update:semver-minor
